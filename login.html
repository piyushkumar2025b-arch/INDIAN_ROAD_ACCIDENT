<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authentication — India Accident Hotspot System</title>
  <meta name="description" content="Admin Authentication for India Accident Hotspot System." />
  <meta property="og:title" content="Admin Authentication — India Accident Hotspot System" />
  <meta property="og:description" content="Admin Authentication for India Accident Hotspot System." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(220, 38, 38, 0.1), transparent 40%),
                  var(--bg-main);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #4f46e5, #dc2626);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }
    .auth-header h2 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .auth-header p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Admin Portal Login</h2>
        <p>Authenticate with Supabase credentials to access database management and CRUD studio.</p>
      </div>

      <div id="authAlert" class="alert-banner alert-danger" style="display:none; margin-bottom:16px;">
        <span id="authAlertMsg">Invalid credentials</span>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Administrator Email <span class="required">*</span></label>
          <input type="email" id="loginEmail" class="input-control" placeholder="admin@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password <span class="required">*</span></label>
          <input type="password" id="loginPassword" class="input-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="btnLogin" style="width:100%; padding:10px;">
          Authenticate to Admin Studio
        </button>

        <div style="display:flex; align-items:center; gap:8px; margin: 4px 0;">
          <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
          <span style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">or instant testing</span>
          <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
        </div>

        <button type="button" class="btn btn-secondary" id="btnDemoAdmin" style="width:100%; padding:9px; justify-content:center; gap:8px; border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.08);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span style="color:#6366f1; font-weight:600;">Launch One-Click Demo Admin</span>
        </button>

        <div style="text-align:center; margin-top:12px;">
          <a href="index.html" style="font-size:0.82rem; color:var(--text-secondary); display:inline-flex; align-items:center; gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Return to Public Map
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Auto-redirect if already logged in with admin role
      const sessionData = await window.auth.getSession();
      if (sessionData?.user && sessionData?.profile?.role === "admin") {
        window.location.href = "admin.html";
        return;
      }

      const form = document.getElementById("loginForm");
      const alertBox = document.getElementById("authAlert");
      const alertMsg = document.getElementById("authAlertMsg");
      const btn = document.getElementById("btnLogin");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        btn.disabled = true;
        btn.textContent = "Authenticating...";

        try {
          const { user, profile } = await window.auth.login(email, password);

          if (!profile || profile.role !== "admin") {
            alertMsg.textContent = "Access Denied: Your account does not have administrator privileges in profiles table.";
            alertBox.style.display = "flex";
            await window.auth.logout();
            btn.disabled = false;
            btn.textContent = "Authenticate to Admin Studio";
            return;
          }

          window.location.href = "admin.html";
        } catch (err) {
          alertMsg.textContent = err.message || "Authentication failed. Verify your email and password.";
          alertBox.style.display = "flex";
          btn.disabled = false;
          btn.textContent = "Authenticate to Admin Studio";
        }
      });

      const demoBtn = document.getElementById("btnDemoAdmin");
      if (demoBtn) {
        demoBtn.addEventListener("click", async () => {
          demoBtn.disabled = true;
          demoBtn.textContent = "Launching Demo Session...";
          try {
            await window.auth.loginDemoAdmin();
            window.location.href = "admin.html";
          } catch (err) {
            alertMsg.textContent = "Could not initialize demo session: " + err.message;
            alertBox.style.display = "flex";
            demoBtn.disabled = false;
            demoBtn.textContent = "Launch One-Click Demo Admin";
          }
        });
      }
    });
  </script>
</body>
</html>
